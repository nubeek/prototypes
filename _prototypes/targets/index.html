<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // This page's assets are relative (e.g. "styles.css", "scripts/..."). If it's
    // ever opened without a trailing slash, the browser resolves those relative
    // paths against the wrong base and the page fails to load. Normalize first.
    if (!window.location.pathname.endsWith("/")) {
      window.location.replace(window.location.pathname + "/" + window.location.search + window.location.hash);
    }
  </script>
  <title>Targets</title>
    <link rel="icon" href="../../assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="../../assets/x96.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="../../assets/x192.png" />
    <link rel="manifest" href="../../assets/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="../../scripts/gate.js"></script>
  <link rel="stylesheet" href="../../styles/gate.css">
</head>
<body class="targets-index access-locked">
  <div class="access-gate" data-access-gate>
    <form class="access-gate__panel" data-access-form autocomplete="on" method="get" action="./">
      <label class="access-gate__label" for="accessPassword">To access this page enter password:</label>
      <input type="text" name="username" autocomplete="username" value="prototype-access" hidden readonly>
      <input class="access-gate__input" id="accessPassword" data-access-password type="password" name="password" autocomplete="current-password" autofocus>
      <button class="ui-control ui-button ui-button-primary access-gate__button" type="submit">Access</button>
      <p class="access-gate__error" data-access-error role="alert" hidden>Incorrect password.</p>
    </form>
  </div>

  <main class="targets-page">
    <div class="grid-header">
      <h1 class="targets-title">Targets</h1>
    </div>

    <div class="grid-toolbar-sentinel" aria-hidden="true"></div>
    <div class="grid-toolbar">
      <nav class="grid-tabs" aria-label="Target scope">
        <button class="grid-tab is-active" type="button" data-scope="all">All</button>
        <button class="grid-tab" type="button" data-scope="private">Private</button>
        <button class="grid-tab" type="button" data-scope="team">Team</button>
      </nav>

      <div class="grid-toolbar-actions">
        <details class="toolbar-dropdown" id="targetGridMenuDropdown">
          <summary class="ui-control ui-button ui-button-ghost toolbar-menu toolbar-btn" aria-label="More options" title="More options">
            <img class="toolbar-asset-icon" src="assets/menu.svg" alt="" aria-hidden="true">
            <img class="toolbar-chevron" src="assets/chevron.svg" alt="" aria-hidden="true">
          </summary>
          <div class="ui-menu toolbar-dropdown-menu" role="menu" aria-label="More options menu">
            <button class="ui-menu-item toolbar-dropdown-option card-view-option" id="cardViewLocationOption" type="button" role="menuitemcheckbox" aria-checked="true" data-card-view="location">
              <span class="toolbar-dropdown-label">Locations</span>
              <img class="card-view-option-check" src="assets/check.svg" alt="" aria-hidden="true">
            </button>
            <button class="ui-menu-item toolbar-dropdown-option card-view-option" id="cardViewFranchisesOption" type="button" role="menuitemcheckbox" aria-checked="true" data-card-view="franchises">
              <span class="toolbar-dropdown-label">Franchises</span>
              <img class="card-view-option-check" src="assets/check.svg" alt="" aria-hidden="true">
            </button>
          </div>
        </details>
        <span class="grid-toolbar-divider" aria-hidden="true"></span>
        <label class="target-search-btn" for="targetSearch" role="search">
          <img class="target-search-icon" src="assets/search.svg" alt="" aria-hidden="true">
          <input
            class="target-search-input"
            id="targetSearch"
            type="search"
            inputmode="search"
            autocomplete="off"
            placeholder="Search targets..."
            aria-label="Search targets"
          >
          <button class="target-search-clear" id="targetSearchClear" type="button" aria-label="Clear search" hidden></button>
        </label>
      </div>
    </div>

    <div class="targets-scroll" id="targetsScroll">
      <div class="targets-grid" id="targetsGrid"></div>
      <p class="targets-empty" id="targetsEmpty" hidden>No targets match your search.</p>
    </div>
  </main>

  <script src="../../scripts/cst-env.js"></script>
  <script src="data/targets.js"></script>
  <script src="data/state-bounds.js"></script>
  <script src="data/water-exclusion.js"></script>
  <script src="franchises.js"></script>
  <script src="map-snapshot.js"></script>
  <script src="grid.js"></script>
</body>
</html>
