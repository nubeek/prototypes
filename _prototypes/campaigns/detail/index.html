<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    if (!window.location.pathname.endsWith("/")) {
      window.location.replace(window.location.pathname + "/" + window.location.search + window.location.hash);
    }
  </script>
  <script src="../../shared/ui/soft-reload.js"></script>
  <title>Campaign</title>
  <link rel="icon" href="../../../assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="../../../assets/x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="../../../assets/x32.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="../../../assets/x96.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="../../../assets/x192.png" />
  <link rel="manifest" href="../../../assets/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../../shared/ui/proto-modal.css">
  <link rel="stylesheet" href="../../shared/ui/action-tooltip.css">
  <link rel="stylesheet" href="../../shared/filter/filter-sidebar.css">
  <link rel="stylesheet" href="../../../styles/site-header.css">
  <script src="../../../scripts/gate.js"></script>
  <script src="../../../scripts/site-header.js"></script>
  <script src="../../../scripts/proto-nav.js"></script>
  <link rel="stylesheet" href="../../../styles/gate.css">
</head>
<body class="access-locked">
  <div class="access-gate" data-access-gate>
    <form class="access-gate__panel" data-access-form autocomplete="off" method="get" action="./">
      <label class="access-gate__label" for="accessPassword">To access this page enter password:</label>
      <input class="access-gate__input" id="accessPassword" data-access-password type="text" name="accessKey" autocomplete="off">
      <button class="ui-control ui-button ui-button-primary access-gate__button" type="submit">Access</button>
      <p class="access-gate__error" data-access-error role="alert" hidden>Incorrect password.</p>
    </form>
  </div>

  <header class="site-header" aria-label="Application header">
    <div class="site-header-start">
      <button class="site-header-menu" type="button" aria-label="Open menu">
        <img src="../../../assets/icons/menu.svg" alt="" width="14" height="12">
      </button>
      <a class="brand-lockup" href="../../" aria-label="Wefranch home">
        <img class="brand-mark" src="../../../assets/logo-wefranch.svg" alt="" width="11" height="16">
      </a>
      <nav class="breadcrumb" aria-label="Breadcrumb" data-site-breadcrumb>
        <a class="breadcrumb-link" href="../">Campaigns</a>
        <span class="breadcrumb-separator" aria-hidden="true">/</span>
        <span class="breadcrumb-current" aria-current="page">Campaign</span>
      </nav>
    </div>
  </header>

  <main class="campaign-page" id="campaignPage">
    <div class="campaign-page__content" id="campaignPageContent" hidden>
      <div class="campaign-page__main proto-scrollbar" id="campaignPageMain">
        <header class="campaign-page__header">
          <h1 class="campaign-page__title" id="campaignTitle"></h1>
          <div class="campaign-page__status" id="campaignStatus"></div>
        </header>

        <section class="campaign-recipients" aria-labelledby="campaignRecipientsTitle">
          <h2 class="sr-only" id="campaignRecipientsTitle">Recipients</h2>
          <div class="scope-toolbar campaign-recipients__toolbar" id="recipientToolbar">
            <div class="scope-tabs campaign-recipients__segments" id="recipientSegments" role="tablist" aria-label="Recipient segments"></div>
            <div class="campaign-recipients__tools">
              <form class="scope-search" id="recipientSearch" role="search" autocomplete="off">
                <img class="scope-search-icon" src="../../../assets/icons/search.svg" alt="" aria-hidden="true">
                <input
                  class="scope-search-input"
                  id="recipientSearchInput"
                  type="search"
                  inputmode="search"
                  autocomplete="off"
                  placeholder="Search recipients"
                  aria-label="Search recipients"
                >
                <button class="scope-search-clear" id="recipientSearchClear" type="button" aria-label="Clear search" hidden></button>
              </form>
              <button class="ui-control ui-button ui-button-ghost ui-icon-button campaign-sidebar-toggle" id="campaignSidebarToggle" type="button" aria-controls="campaignSidebar" aria-expanded="true" aria-label="Hide details" title="Hide details">
                <img src="../../../assets/icons/sidebar.svg" alt="" aria-hidden="true" width="18" height="18">
              </button>
            </div>
          </div>

          <div class="campaign-recipients__table-wrap" id="recipientTableWrap" role="tabpanel" aria-labelledby="campaignRecipientsTitle">
            <table class="proto-table campaign-recipients__table" id="recipientTable">
              <thead>
                <tr>
                  <th class="sortable-header" data-sort-key="name" aria-sort="none" tabindex="0" style="width: 22%">
                    <span class="th-content">Name <img class="th-chevron" src="../../../assets/icons/chevron.svg" alt="" aria-hidden="true"></span>
                  </th>
                  <th class="sortable-header" data-sort-key="email" aria-sort="none" tabindex="0" style="width: 30%">
                    <span class="th-content">Email <img class="th-chevron" src="../../../assets/icons/chevron.svg" alt="" aria-hidden="true"></span>
                  </th>
                  <th class="sortable-header" data-sort-key="company" aria-sort="none" tabindex="0" style="width: 22%">
                    <span class="th-content">Company <img class="th-chevron" src="../../../assets/icons/chevron.svg" alt="" aria-hidden="true"></span>
                  </th>
                  <th class="sortable-header" data-sort-key="status" aria-sort="none" tabindex="0" style="width: 13%">
                    <span class="th-content">Status <img class="th-chevron" src="../../../assets/icons/chevron.svg" alt="" aria-hidden="true"></span>
                  </th>
                  <th class="sortable-header" data-sort-key="lastActivityAt" aria-sort="descending" tabindex="0" style="width: 13%">
                    <span class="th-content"><span id="recipientActivityLabel">Last activity</span> <img class="th-chevron" src="../../../assets/icons/chevron.svg" alt="" aria-hidden="true"></span>
                  </th>
                </tr>
              </thead>
              <tbody id="recipientTableBody"></tbody>
            </table>
            <div class="empty-state empty-state--overlay" id="recipientEmpty" hidden>
              <p class="empty-state__message" id="recipientEmptyMessage">No recipients in this segment yet.</p>
            </div>
          </div>

          <div class="campaign-recipients__footer" id="recipientFooter" hidden>
            <span class="campaign-recipients__count" id="recipientCount"></span>
            <button class="ui-control ui-text-button" id="recipientShowMore" type="button">Show more</button>
          </div>
        </section>
      </div>

      <aside class="campaign-sidebar" id="campaignSidebar" aria-label="Campaign details">
        <div class="campaign-sidebar__panel">
          <button class="ui-control ui-close-button campaign-sidebar__close" id="campaignSidebarClose" type="button" aria-label="Hide details">
            <img src="../../../assets/icons/close.svg" alt="" aria-hidden="true">
          </button>
          <div class="campaign-sidebar__scroll proto-scrollbar" id="campaignSidebarScroll">
            <section class="campaign-sidebar__section" aria-labelledby="campaignDetailsTitle">
              <div class="campaign-sidebar__section-head">
                <h2 class="campaign-sidebar__title" id="campaignDetailsTitle">Details</h2>
              </div>
              <dl class="campaign-sidebar__fields" id="campaignFields"></dl>
            </section>

            <section class="campaign-sidebar__section" aria-labelledby="campaignStatsTitle">
              <div class="campaign-sidebar__section-head">
                <h2 class="campaign-sidebar__title" id="campaignStatsTitle">Statistics</h2>
              </div>
              <div class="campaign-sidebar__metrics" id="campaignMetrics"></div>
            </section>

            <section class="campaign-sidebar__section campaign-sidebar__message" aria-labelledby="campaignMessageTitle">
              <div class="campaign-sidebar__section-head">
                <h2 class="campaign-sidebar__title" id="campaignMessageTitle">Message</h2>
                <span class="campaign-sidebar__template" id="campaignMessageTemplate"></span>
              </div>
              <div class="scope-tabs campaign-sidebar__emails" id="campaignMessageEmails" role="tablist" aria-label="Sequence emails" hidden></div>
              <dl class="campaign-sidebar__fields campaign-sidebar__fields--message">
                <div class="campaign-sidebar__field is-full">
                  <dt class="campaign-sidebar__label">Subject</dt>
                  <dd class="campaign-sidebar__value" id="campaignMessageSubject"></dd>
                </div>
                <div class="campaign-sidebar__field is-full">
                  <dt class="campaign-sidebar__label">Preview text</dt>
                  <dd class="campaign-sidebar__value" id="campaignMessagePreview"></dd>
                </div>
                <div class="campaign-sidebar__field is-full">
                  <dt class="campaign-sidebar__label">Design</dt>
                  <dd class="campaign-sidebar__value campaign-sidebar__design">
                    <img class="campaign-sidebar__image" id="campaignMessageImage" alt="">
                  </dd>
                </div>
              </dl>
            </section>
          </div>
        </div>
      </aside>
    </div>

    <div class="empty-state empty-state--fill" id="campaignNotFound" hidden>
      <p class="empty-state__message">This campaign doesn't exist or was deleted.</p>
      <a class="empty-state__action ui-text-button" href="../">Back to campaigns</a>
    </div>
  </main>

  <script src="../../shared/ui/proto-field-captions.js"></script>
  <script src="../../shared/ui/proto-field-error.js"></script>
  <script src="../../shared/ui/compact-select.js"></script>
  <script src="../../shared/ui/proto-modal.js"></script>
  <script src="../../shared/ui/proto-confirm-modal.js"></script>
  <script src="../../shared/ui/proto-toast.js"></script>
  <script src="../../shared/ui/action-tooltip.js"></script>
  <script src="../../shared/filter/filter-combobox.js"></script>
  <script src="../../cst/data/saved-searches.js"></script>
  <script src="../../shared/data/campaigns-store.js"></script>
  <script src="../../shared/data/campaign-recipients.js"></script>
  <script src="../scripts/campaigns-data.js"></script>
  <script src="../../shared/campaign/campaign-wizard-markup.js"></script>
  <script src="../../shared/campaign/campaign-wizard.js"></script>
  <script src="../scripts/campaign-format.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
