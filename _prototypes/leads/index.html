<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    if (!window.location.pathname.endsWith("/")) {
      window.location.replace(window.location.pathname + "/" + window.location.search + window.location.hash);
    }
  </script>
  <script src="../shared/ui/soft-reload.js"></script>
  <title>Leads</title>
  <link rel="icon" href="../../assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="../../assets/x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/x32.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="../../assets/x96.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="../../assets/x192.png" />
  <link rel="manifest" href="../../assets/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../shared/ui/proto-modal.css">
  <link rel="stylesheet" href="../shared/filter/filter-sidebar.css">
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.11.0/mapbox-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/site-header.css">
  <script src="../../scripts/gate.js"></script>
  <script src="../../scripts/site-header.js"></script>
  <script src="../../scripts/proto-nav.js"></script>
  <link rel="stylesheet" href="../../styles/gate.css">
</head>
<body class="access-locked">
  <div class="access-gate" data-access-gate>
    <form class="access-gate__panel" data-access-form autocomplete="off" method="get" action="./">
      <label class="access-gate__label" for="accessPassword">To access this page enter password:</label>
      <input class="access-gate__input" id="accessPassword" data-access-password type="text" name="accessKey" autocomplete="off">
      <button class="ui-control ui-button ui-button-primary access-gate__button" type="submit">Access</button>
      <p class="access-gate__error" data-access-error role="alert" hidden>Incorrect password.</p>
    </form>
  </div>

  <header class="site-header" aria-label="Application header">
    <div class="site-header-start">
      <button class="site-header-menu" type="button" aria-label="Open menu">
        <img src="../../assets/icons/menu.svg" alt="" width="14" height="12">
      </button>
      <a class="brand-lockup" href="../" aria-label="Wefranch home">
        <img class="brand-mark" src="../../assets/logo-wefranch.svg" alt="" width="11" height="16">
      </a>
      <nav class="breadcrumb" aria-label="Breadcrumb" data-site-breadcrumb>
        <span class="breadcrumb-current" aria-current="page">Leads</span>
      </nav>
    </div>
  </header>

  <main class="card">
    <div class="content-shell">
      <div class="header" aria-label="Leads toolbar">
        <div class="toolbar-group toolbar-primary">
          <button class="ui-control ui-button ui-button-ghost filter-toggle-btn toolbar-btn" id="filterToggle" type="button" aria-label="Toggle filters" title="Toggle filters" aria-controls="filterPanel" aria-expanded="false">
            <img class="toolbar-asset-icon filter-toggle-icon" src="../../assets/icons/filters.svg" alt="" aria-hidden="true">
            <span id="filterToggleLabel">Filters</span>
          </button>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <button class="ui-control ui-button ui-button-ghost ui-icon-button filter-toggle-btn toolbar-btn" id="exportBtn" type="button" aria-label="Export" title="Export">
            <img class="toolbar-asset-icon toolbar-export-icon" src="../../assets/icons/export-csv.svg" alt="" aria-hidden="true">
          </button>
        </div>

        <div class="toolbar-group toolbar-actions">
          <label class="toolbar-search-btn toolbar-btn" for="toolbarSearchInput" role="search">
            <img class="toolbar-asset-icon toolbar-search-icon" src="../../assets/icons/search.svg" alt="" aria-hidden="true">
            <input
              class="toolbar-search-input"
              id="toolbarSearchInput"
              type="search"
              inputmode="search"
              autocomplete="off"
              placeholder="Search by name, email or franchise..."
              aria-label="Search leads"
            >
            <button class="toolbar-search-clear" id="toolbarSearchClear" type="button" aria-label="Clear search" hidden></button>
          </label>
          <button class="ui-control ui-button ui-button-primary filter-toggle-btn" id="addLeadBtn" type="button" aria-controls="leadDetailPanel" aria-expanded="false">
            Add lead
          </button>
        </div>
      </div>

      <div class="workspace">
        <aside class="filter-panel" id="filterPanel" aria-label="Filters">
          <div class="filter-header">
            <h2>Filter</h2>
            <p id="filterSummary">Showing 0 of 0 records</p>
          </div>
          <div class="filter-scroll">
            <section class="filter-section" data-filter-section="stage">
              <button class="ui-control ui-button-ghost filter-section-title" type="button" aria-expanded="true">
                <span>Stage</span>
                <img src="../../assets/icons/chevron.svg" alt="" aria-hidden="true">
              </button>
              <div class="filter-check-group" id="stageFilterGroup"></div>
            </section>

            <section class="filter-section filter-section-collapsed" data-filter-section="list">
              <button class="ui-control ui-button-ghost filter-section-title" type="button" aria-expanded="false">
                <span>List</span>
                <img src="../../assets/icons/chevron.svg" alt="" aria-hidden="true">
              </button>
              <div class="filter-select-field">
                <select class="ui-select filter-field-select" id="listFilterSelect" aria-label="Select list" required>
                  <option value="">Select list...</option>
                </select>
                <img src="../../assets/icons/chevron.svg" alt="" aria-hidden="true">
              </div>
            </section>

            <section class="filter-section filter-section-collapsed" data-filter-section="franchise">
              <button class="ui-control ui-button-ghost filter-section-title" type="button" aria-expanded="false">
                <span>Franchise</span>
                <img src="../../assets/icons/chevron.svg" alt="" aria-hidden="true">
              </button>
              <div class="filter-select-field">
                <select class="ui-select filter-field-select" id="franchiseFilterSelect" aria-label="Select franchise" required>
                  <option value="">Select franchise...</option>
                </select>
                <img src="../../assets/icons/chevron.svg" alt="" aria-hidden="true">
              </div>
            </section>

            <section class="filter-section filter-section-collapsed" data-filter-section="dates">
              <button class="ui-control ui-button-ghost filter-section-title" type="button" aria-expanded="false">
                <span>Dates added</span>
                <img src="../../assets/icons/chevron.svg" alt="" aria-hidden="true">
              </button>
              <div class="filter-range-labels filter-range-labels--fields">
                <span>From</span>
                <span data-range-label-gap aria-hidden="true">-</span>
                <span>To</span>
              </div>
              <div class="filter-input-row">
                <div class="filter-value filter-date-field" id="datesAddedFromField">
                  <span class="filter-date-parts" role="group" aria-label="From date added">
                    <input class="filter-date-part" data-date-part="day" type="text" inputmode="numeric" maxlength="2" placeholder="dd" aria-label="From day" autocomplete="off" spellcheck="false">
                    <span class="filter-date-sep" aria-hidden="true">/</span>
                    <input class="filter-date-part" data-date-part="month" type="text" inputmode="numeric" maxlength="2" placeholder="mm" aria-label="From month" autocomplete="off" spellcheck="false">
                    <span class="filter-date-sep" aria-hidden="true">/</span>
                    <input class="filter-date-part" data-date-part="year" type="text" inputmode="numeric" maxlength="2" placeholder="yy" aria-label="From year" autocomplete="off" spellcheck="false">
                  </span>
                </div>
                <span class="filter-range-separator">-</span>
                <div class="filter-value filter-date-field" id="datesAddedToField">
                  <span class="filter-date-parts" role="group" aria-label="To date added">
                    <input class="filter-date-part" data-date-part="day" type="text" inputmode="numeric" maxlength="2" placeholder="dd" aria-label="To day" autocomplete="off" spellcheck="false">
                    <span class="filter-date-sep" aria-hidden="true">/</span>
                    <input class="filter-date-part" data-date-part="month" type="text" inputmode="numeric" maxlength="2" placeholder="mm" aria-label="To month" autocomplete="off" spellcheck="false">
                    <span class="filter-date-sep" aria-hidden="true">/</span>
                    <input class="filter-date-part" data-date-part="year" type="text" inputmode="numeric" maxlength="2" placeholder="yy" aria-label="To year" autocomplete="off" spellcheck="false">
                  </span>
                </div>
              </div>
            </section>
          </div>
          <div class="filter-actions">
            <button class="ui-control ui-button ui-button-muted clear-filters-btn" id="clearAllFilters" type="button">Clear all (0)</button>
          </div>
        </aside>

        <div class="workspace-main">
          <div class="table-column">
            <header class="table-heading">
              <div class="table-heading__row">
                <div class="table-heading__title-group">
                  <div class="table-heading__title">
                    <h2 id="tableHeadingTitle">Leads</h2>
                  </div>
                </div>
              </div>
              <p id="tableHeadingSummary" aria-live="polite">Showing 0 leads.</p>
            </header>
            <div class="table-wrap" id="tableWrap">
              <table class="has-row-select proto-table">
                <thead>
                  <tr>
                    <th id="leadSelectColumnHeader" class="location-number-header" style="width: 48px">
                      <label class="location-row-select location-select-all" aria-label="Select all lead rows">
                        <input class="location-row-checkbox location-select-all-checkbox" type="checkbox">
                        <span class="location-row-checkbox-visual" aria-hidden="true"></span>
                      </label>
                    </th>
                    <th class="sortable-header" data-sort-key="name" aria-sort="none" style="width: 18%">
                      <span class="th-content">Name <img class="th-chevron" src="../../assets/icons/chevron.svg" alt="" aria-hidden="true"></span>
                    </th>
                    <th class="sortable-header" data-sort-key="email" aria-sort="none" style="width: 20%">
                      <span class="th-content">Email <img class="th-chevron" src="../../assets/icons/chevron.svg" alt="" aria-hidden="true"></span>
                    </th>
                    <th class="sortable-header" data-sort-key="phone" aria-sort="none" style="width: 13%">
                      <span class="th-content">Phone <img class="th-chevron" src="../../assets/icons/chevron.svg" alt="" aria-hidden="true"></span>
                    </th>
                    <th class="sortable-header" data-sort-key="franchise" aria-sort="none" style="width: 15%">
                      <span class="th-content">Franchise <img class="th-chevron" src="../../assets/icons/chevron.svg" alt="" aria-hidden="true"></span>
                    </th>
                    <th class="sortable-header" data-sort-key="list" aria-sort="none" style="width: 14%">
                      <span class="th-content">List <img class="th-chevron" src="../../assets/icons/chevron.svg" alt="" aria-hidden="true"></span>
                    </th>
                    <th class="sortable-header" data-sort-key="stage" aria-sort="none" style="width: 12%">
                      <span class="th-content">Stage <img class="th-chevron" src="../../assets/icons/chevron.svg" alt="" aria-hidden="true"></span>
                    </th>
                    <th class="sortable-header" data-sort-key="addedAt" aria-sort="descending" style="width: 8%">
                      <span class="th-content">Added <img class="th-chevron" src="../../assets/icons/chevron.svg" alt="" aria-hidden="true"></span>
                    </th>
                  </tr>
                </thead>
                <tbody id="leadsTableBody"></tbody>
              </table>
              <div class="table-empty-state" id="tableEmptyState" role="status" hidden>
                <div class="table-empty-state__content">
                  <p class="table-empty-state__message" id="tableEmptyStateMessage">No leads yet. Save a contact as a lead from Prospects to see them here.</p>
                  <a class="ui-control ui-link table-empty-state__action" id="tableEmptyStateAction" href="../cst/">Open Prospects</a>
                  <button class="ui-control ui-link table-empty-state__action" id="tableEmptyStateClear" type="button" hidden>Clear filters</button>
                </div>
              </div>
            </div>
          </div>

          <aside class="lead-detail-panel" id="leadDetailPanel" aria-label="Lead details" aria-hidden="true" inert>
            <div class="lead-detail-panel__inner">
              <section class="lead-detail" aria-labelledby="leadDetailName">
                <button class="ui-control ui-close-button owner-detail-close profile-modal-close" type="button" aria-label="Close lead">
                  <img src="../../assets/icons/close.svg" alt="" aria-hidden="true">
                </button>
                <form class="lead-detail-form" id="leadDetailForm" novalidate>
                  <div id="leadDetailHero"></div>
                  <div class="profile-modal-body profile-modal-content proto-scrollbar" id="leadDetailContent"></div>
                  <div class="profile-modal-actions" id="leadDetailActions"></div>
                </form>
              </section>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </main>

  <script src="../../scripts/cst-env.js"></script>
  <script src="../shared/data/categories.js"></script>
  <script src="../shared/filter/location-search.js"></script>
  <script src="../shared/data/leads-store.js"></script>
  <script src="../shared/ui/proto-field-captions.js"></script>
  <script src="../shared/ui/proto-field-error.js"></script>
  <script src="../shared/ui/fit-tooltip.js"></script>
  <script src="../shared/filter/filter-combobox.js"></script>
  <script src="../shared/filter/filter-date.js"></script>
  <script src="../shared/filter/filter-sections.js"></script>
  <script src="scripts/leads-data.js"></script>
  <script src="scripts/lead-modals.js"></script>
  <script src="scripts/bootstrap.js"></script>
</body>
</html>
